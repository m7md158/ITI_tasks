<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>All Books</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Book</th>
            <th>Type</th>
            <th>Author</th>
            <th>Action</th> 
            <th>Action</th>
        </tr>
        {% for book in books %}
            <tr>
                <td><a href="{% url 'book_detail' book.id %}">{{ book.name }}</a></td>
                <td>{{ book.type }}</td>
                <td><a href="{% url 'author_books' book.author.id %}">{{ book.author.name }}</a></td>
                <td><button><a href="{% url 'book_delete' book.id %}">Delete</a></button></td>
                <td><button><a href="{% url 'book_update' book.id %}">Edit</a></button></td>
            </tr>
        {% endfor %}
    </table>

    <!-- button for create new book -->
    <br>
    <button><a href="{% url 'book_create' %}">Create New Book</a></button>

    
</body>
</html>
